[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nvidia-rag-test-pipeline"
version = "0.1.0"
description = "Benchmark-ready RAG pipeline using LangChain, FAISS, and NVIDIA NIM endpoints."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "faiss-cpu>=1.8",
  "langchain>=0.3",
  "langchain-community>=0.3",
  "langchain-nvidia-ai-endpoints>=0.3",
  "pandas>=2.2",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  "uvicorn[standard]>=0.32",
]

[project.scripts]
nvidia-rag = "nvidia_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
